name: Goal model scoreboard

# Every Monday: download the week's games, rebuild the shot features and score the FROZEN goal models
# (rinkside/research/goal-model/frozen) on games played after the freeze cutoff. Commits scoreboard/.
on:
  schedule:
    - cron: "17 11 * * 1"   # Mondays 11:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goal-model-scoreboard
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: rinkside/research/goal-model
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install --quiet pandas pyarrow lightgbm scikit-learn

      # finished games never change: keep downloads between runs so only new games are fetched
      - uses: actions/cache@v4
        with:
          path: rinkside/research/goal-model/work
          key: goal-model-data-${{ github.run_id }}
          restore-keys: goal-model-data-

      - name: Download, rebuild features, score
        run: bash scripts/run.sh

      - name: Commit scoreboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scoreboard
          git diff --cached --quiet && exit 0
          git commit -m "Goal model scoreboard: $(date -u +%Y-%m-%d)"
          git push
