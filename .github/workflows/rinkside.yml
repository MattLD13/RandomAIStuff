name: Rinkside

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  push:
    branches: [main]
    paths: ["rinkside/**", ".github/workflows/rinkside.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rinkside-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rinkside
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch NHL data
        run: node scripts/build-data.mjs

      - name: Render phone wallpaper
        continue-on-error: true
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/render-wallpaper.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: rinkside/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
