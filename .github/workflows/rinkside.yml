name: Rinkside

on:
  schedule:
    - cron: "13,43 * * * *"   # every 30 minutes (UTC), off the busy :00/:30 marks GitHub often skips
  push:
    branches: [main]
    paths: ["rinkside/**", "!rinkside/research/**", ".github/workflows/rinkside.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rinkside-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rinkside
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # play-by-play of finished games never changes: keep it between runs so only new games download
      - uses: actions/cache@v4
        with:
          path: rinkside/.cache
          key: rinkside-shots-${{ github.run_id }}
          restore-keys: rinkside-shots-

      - name: Fetch NHL data
        run: node scripts/build-data.mjs

      # Empty Net: the daily comeback game at /drill (real endings from play-by-play, cached in .cache/drill)
      - name: Build Empty Net
        continue-on-error: true
        run: node scripts/build-drill.mjs || node scripts/build-drill.mjs --offline

      # Courtside (NBA), Sideline (NFL), Dugout (MLB), Pitchside (MLS): ESPN data, same board
      - name: Fetch other leagues
        continue-on-error: true
        run: node scripts/build-sports.mjs

      - name: Render phone wallpaper
        continue-on-error: true
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/render-wallpaper.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: rinkside/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
